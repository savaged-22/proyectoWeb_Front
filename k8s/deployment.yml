# ─────────────────────────────────────────────────────────────────
# Frontend Angular — Deployment
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proyectoweb-frontend
  namespace: grupo12
  labels:
    app: proyectoweb-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proyectoweb-frontend
  template:
    metadata:
      labels:
        app: proyectoweb-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: proyectoweb-frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ─────────────────────────────────────────────────────────────────
# Frontend — Service
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: proyectoweb-frontend
  namespace: grupo12
  labels:
    app: proyectoweb-frontend
spec:
  selector:
    app: proyectoweb-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────────────
# Frontend — Ingress
# ─────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proyectoweb-frontend-ingress
  namespace: grupo12
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: public
  rules:
    - host: grupo12.inphotech.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proyectoweb-frontend
                port:
                  number: 80
