name: Deploy Frontend - Lulo

on:
  push:
    branches:
      - produccion

env:
  K8S_NAMESPACE: proyectoweb
  DEPLOYMENT_NAME: frontend

jobs:

  deploy:
    name: Build & Deploy en k3s
    runs-on: [self-hosted, lulo-frontend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagen Docker local
        run: |
          docker build -t lulo-frontend:latest ./frontend_final
          echo "✓ Imagen lulo-frontend:latest construida"

      - name: Aplicar al cluster k3s
        run: |
          kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Verificar despliegue
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=120s

      - name: Estado final de pods
        if: always()
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
