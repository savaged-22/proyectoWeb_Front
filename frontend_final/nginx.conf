server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bundles versionados (hash en nombre) -> cache largo, immutable.
    location ~* \.(?:css|js|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes y fuentes con cache razonable.
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html SIEMPRE fresco. Sin esto el navegador queda con un index
    # cacheado que apunta a bundles que ya no existen y la app rompe al
    # refrescar o avanzar/retroceder.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # SPA: cualquier ruta no existente cae a index.html (Angular router).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy al backend dentro de la red Docker. Evita CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
